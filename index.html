    <title>Memory Match — the card matching game, free</title>
    <meta
      name="description"
      content="Play the classic memory game: flip two cards a turn and find every matching pair. Four board sizes from 12 to 36 cards, a timer, move count, star rating and saved best scores. Plays in your browser, no sign-up."
    />
    <link rel="canonical" href="https://memory-match.correia95.workers.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Memory Match" />
    <meta property="og:description" content="The classic card matching game: find every pair in as few moves as you can. Four sizes, timer, stars, best scores. Free, no sign-up." />
    <meta property="og:url" content="https://memory-match.correia95.workers.dev/" />
    <meta property="og:image" content="https://memory-match.correia95.workers.dev/og.svg" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Memory Match" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Memory Match",
        "url": "https://memory-match.correia95.workers.dev/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "genre": "Puzzle",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "The classic concentration card game: flip two cards a turn to find matching pairs, across four board sizes with a timer, move count and star rating."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do you play the memory matching game?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "All cards start face down. Flip one, then a second. If they match, they stay up. If not, they flip back and you try to remember where they were. Clear the whole board to win."
            }
          },
          {
            "@type": "Question",
            "name": "How is the score calculated?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "By time and by moves, where a move is one pair of flips. The fewest possible moves is one per pair. Three stars is a near-perfect run, two is solid, one means try again. Your best time and moves per board size are saved."
            }
          },
          {
            "@type": "Question",
            "name": "What board sizes are there?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Easy is 12 cards, Medium 16, Hard 24 and Expert 36 (six by six, eighteen pairs). The cards are shuffled fresh each game."
            }
          },
          {
            "@type": "Question",
            "name": "Is it good for kids?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The Easy board is a good size for young children and the game is a well-known way to practise concentration and short-term memory. There are no ads and nothing to sign up for."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <p style="text-align: center; padding: 20px">
        Memory Match needs JavaScript. It is the classic card matching game: flip two cards a turn to
        find every pair, across four board sizes with a timer and star rating.
      </p>
    </noscript>
  </body>
</html>
