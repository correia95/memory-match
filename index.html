      }

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do you play the memory matching game?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "All cards start face down. Flip one, then a second. If they match, they stay up. If not, they flip back and you try to remember where they were. Clear the whole board to win."
            }
          },
          {
            "@type": "Question",
            "name": "How is the score calculated?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "By time and by moves, where a move is one pair of flips. The fewest possible moves is one per pair. Three stars is a near-perfect run, two is solid, one means try again. Your best time and moves per board size are saved."
            }
          },
          {
            "@type": "Question",
            "name": "What board sizes are there?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Easy is 12 cards, Medium 16, Hard 24 and Expert 36 (six by six, eighteen pairs). The cards are shuffled fresh each game."
            }
          },
          {
            "@type": "Question",
            "name": "Is it good for kids?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The Easy board is a good size for young children and the game is a well-known way to practise concentration and short-term memory. There are no ads and nothing to sign up for."
            }
          }
        ]
      }
    </script>
